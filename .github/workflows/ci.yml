name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (all tests)
            os: ubuntu-latest
            unit-tests-only: 'false'
          - name: Windows (unit tests)
            os: windows-latest
            unit-tests-only: 'true'
          - name: macOS (unit tests)
            os: macos-latest
            unit-tests-only: 'true'
    env:
      UNIT_TESTS_ONLY: ${{ matrix.unit-tests-only }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build Chatly.slnx

      - name: Test (Linux/macOS)
        if: runner.os != 'Windows'
        run: scripts/unix/tests.sh

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/windows/tests.ps1
