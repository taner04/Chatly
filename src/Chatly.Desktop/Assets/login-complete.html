<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Sign-in complete | Chatly</title>
    <link href="{{CHATLY_LOGO_DATA_URI}}" rel="icon">
    <style>
        :root {
            color-scheme: light dark;
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --background: #f4f5f7;
            --surface: rgba(255, 255, 255, 0.92);
            --border: #d9dce3;
            --text: #1a1d24;
            --muted: #626875;
            --shadow: rgba(22, 27, 38, 0.14);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #121214;
                --surface: rgba(44, 44, 46, 0.92);
                --border: #3a3a3c;
                --text: #ffffff;
                --muted: #aeaeb2;
                --shadow: rgba(0, 0, 0, 0.4);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--text);
            background: radial-gradient(circle at 50% 10%, rgba(98, 104, 117, 0.16), transparent 38%),
            var(--background);
        }

        main {
            width: min(100%, 420px);
            padding: 40px;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 18px 50px var(--shadow);
            backdrop-filter: blur(18px);
        }

        img {
            width: 72px;
            height: 72px;
            display: block;
            margin: 0 auto 24px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 25px;
            line-height: 1.2;
            letter-spacing: -0.025em;
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
            padding: 8px 12px;
            color: var(--muted);
            background: color-mix(in srgb, var(--border) 45%, transparent);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .dot {
            width: 7px;
            height: 7px;
            background: #23a559;
            border-radius: 50%;
        }
    </style>
</head>
<body>
<main>
    <img alt="Chatly logo" src="{{CHATLY_LOGO_DATA_URI}}">
    <h1>Sign-in complete</h1>
    <p>Your identity was verified. You can close this tab and continue in Chatly.</p>
    <div class="status"><span class="dot"></span>Connected to Chatly</div>
</main>
</body>
</html>
